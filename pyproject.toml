[project]
name = "graph-intune-mcp"
version = "0.1.0"
description = "MCP server: Intune encryption states, trends over time, and last sync for active devices via Microsoft Graph"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "msal>=1.28", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
graph-intune-mcp = "graph_intune_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
